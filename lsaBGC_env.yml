name: lsaBGC-Pan
channels:
  - conda-forge
  - bioconda
dependencies:
  - python
  - setuptools
  - pip
  - zol>=1.8.0
  - panaroo>=1.5.2
  - bofasa
  - muscle=5.1
  - famsa
  - orthofinder=2.5.5
  - pyseer>=1.3
  - gecco=0.9.6
  - prodigal
  - pyrodigal
  - biopython
  - tar
  - pandas
  - xlsxwriter>=3.0.3
  - plotly>=5.0
  - matplotlib-base>=3.6
  - scikit-learn>=1.2.2
  - numpy >2.0.0, <=2.2.6
  - intbitset
  - networkx
  - gffutils
  - edlib
  - joblib
  - cd-hit
  # used directly by lsaBGC-Pan - listed explicitly rather than relying on them being pulled in by other packages
  - ete3
  - tqdm
  - rich-argparse
  - scipy
  - trimal
  - fasttree
  - iqtree
  - mcl
  - hmmer
  - pal2nal
  - diamond
  - curl
